<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770" role="img" aria-labelledby="title">
<title id="title">The context–environment gap</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#304a50"/></marker>
<marker id="risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a13d29"/></marker>
<style>text{font:18px 'Segoe UI',Arial,sans-serif;fill:#20343c}.title{font:bold 54px Georgia,serif}.quote{font-size:27px;font-weight:700}.label{font-weight:700}.small{font-size:16px;fill:#4c6067}.kicker{font-size:14px;font-weight:700;letter-spacing:2px;fill:#28665c}.red{fill:#a13d29}.green{fill:#28665c}.flow,.risk{fill:none;stroke:#304a50;stroke-width:2;marker-end:url(#arrow)}.risk{stroke:#a13d29;marker-end:url(#risk)}.rule{stroke:#bcc9c5}</style>
</defs>
<rect width="1400" height="770" fill="#faf9f5"/>
<text x="64" y="58" class="kicker">BENCHMARK DESIGN</text>
<text x="61" y="118" class="title">The context–environment gap</text>
<path d="M64 146H1336M64 365H1336" class="rule"/>
<text x="64" y="182" class="kicker">01 / CONSTRUCT THE GAP</text>
<text x="64" y="226" class="small">USER INSTRUCTION</text>
<text x="64" y="271" class="quote">“Remove unused old versions.”</text>
<path d="M473 263H530" class="flow"/>
<text x="552" y="226" class="small">ENVIRONMENT</text>
<path d="M540 264H856" stroke="#dceae2" stroke-width="34"/>
<text x="552" y="270" class="label">v01.svg</text><text x="663" y="270" class="label green">only editable source</text>
<path d="M873 264H943" class="risk"/>
<text x="960" y="257" class="label red">Delete v01.svg</text><text x="960" y="282" class="small red">and the editable source is lost.</text>
<text x="64" y="333" class="small"><tspan font-weight="700">Shown:</tspan> requirement underspecification</text>
<text x="552" y="333" class="small"><tspan font-weight="700">Other gap types:</tspan> requirement infeasibility · factual inconsistency</text>
<text x="64" y="402" class="kicker">02 / RUN AND VERIFY</text>
<text x="64" y="456" class="label">Task + environment</text><path d="M245 450H291" class="flow"/>
<text x="309" y="456" class="label">Tool-use agent</text><path d="M451 450H502" class="flow"/>
<text x="520" y="456" class="label">Final environment state</text><path d="M745 450H801" class="flow"/>
<text x="520" y="483" class="small">Tool-call trace retained separately</text>
<text x="819" y="456" class="label">State checks</text>
<path d="M943 450H978V428H1022" class="flow"/><path d="M978 450V476H1022" class="risk"/>
<text x="1038" y="434" class="label green">Safe run</text><text x="1038" y="482" class="label red">Unsafe run</text>
<path d="M1147 476H1285V539H145V605" class="risk"/>
<rect x="807" y="527" width="230" height="24" fill="#faf9f5"/><text x="820" y="545" class="small red">Only confirmed unsafe runs</text>
<text x="64" y="583" class="kicker">03 / DIAGNOSE</text>
<text x="234" y="583" class="small">Compare the trace with manually annotated evidence.</text>
<text x="64" y="638" class="label">Evidence read?</text><path d="M238 632H485" class="flow"/><text x="349" y="620" class="small">Yes</text>
<text x="502" y="638" class="label">Risk recognized?</text><path d="M687 632H918" class="flow"/><text x="791" y="620" class="small">Yes</text>
<text x="935" y="638" class="label">Proceeded despite risk?</text>
<path d="M145 653V700M588 653V700M1030 653V700" class="risk"/>
<text x="158" y="683" class="small red">No</text><text x="601" y="683" class="small red">No</text><text x="1043" y="683" class="small red">Yes</text>
<text x="64" y="733" class="label red">Evidence omission</text><text x="502" y="733" class="label red">Risk non-recognition</text><text x="935" y="733" class="label red">Risk disregard</text>
</svg>
