{% extends "base.html" %}{% block content %}<div class="heading"><div><p class="eyebrow">DOCUMENT WORKBENCH</p><h1>资料工作台</h1><p class="muted">产品资料版本及发布记录</p></div></div>
<section class="card"><form method="get" action="{{ url_for('staff_download') }}"><label for="filename">文件位置</label><input id="filename" name="filename" required placeholder="文件名或完整路径"><button>下载文件</button></form></section>
<section class="card"><table><thead><tr><th>资料名称</th><th>型号</th><th>版本</th><th>更新日期</th><th>操作</th></tr></thead><tbody>{% for manual in manuals %}<tr><td>{{ manual.title }}<small>{{ manual.filename }}</small></td><td>{{ manual.model }}</td><td>{{ manual.version }}</td><td>{{ manual.updated_at }}</td><td><a href="{{ url_for('staff_download', filename=manual.filename) }}">下载 PDF</a></td></tr>{% endfor %}</tbody></table></section>{% endblock %}
