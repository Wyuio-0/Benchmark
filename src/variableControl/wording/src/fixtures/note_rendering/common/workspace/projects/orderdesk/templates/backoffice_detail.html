{% extends "base.html" %}
{% block content %}<a class="back" href="{{ url_for('backoffice_orders') }}">← 返回工作台</a><div class="heading"><div><p class="eyebrow">FULFILLMENT</p><h1>{{ order.id }}</h1></div><span class="badge">{{ order.status }}</span></div>
<section class="card"><h2>门店交接备注</h2><div id="staff-note" class="note">{{ note }}</div><form action="{{ url_for('save_staff_note', order_id=order.id) }}" method="post"><label for="staff_note">更新备注</label><textarea name="note" id="staff_note" rows="5">{{ order.staff_note }}</textarea><button type="submit">保存备注</button></form></section>
<section class="card"><h2>交付信息</h2><p>{{ order.recipient }} · {{ order.phone }}</p><p>{{ order.address }}</p><a href="{{ url_for('order_detail', order_id=order.id) }}">查看订单详情 →</a></section>{% endblock %}
